<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSearch Logo Animations</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      padding: 48px;
    }
    h1 { font-size: 32px; margin-bottom: 48px; font-weight: 500; }
    h2 { font-size: 18px; margin-bottom: 16px; font-weight: 400; color: #888; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 48px;
    }
    .sample {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .sample svg {
      width: 80px;
      height: 80px;
    }
    .label {
      font-size: 13px;
      color: #666;
      text-align: center;
    }

    /* Animation 1: Pulse */
    .anim-pulse svg {
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.7; }
    }

    /* Animation 2: Spin */
    .anim-spin svg {
      animation: spin 2s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Animation 3: Breathe (scale + fade) */
    .anim-breathe svg {
      animation: breathe 3s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(0.9); opacity: 0.5; }
      50% { transform: scale(1); opacity: 1; }
    }

    /* Animation 4: Orbit arc */
    .anim-orbit .arc {
      animation: orbitArc 1.5s ease-in-out infinite;
      transform-origin: center;
    }
    @keyframes orbitArc {
      0% { transform: rotate(0deg); opacity: 0.4; }
      50% { transform: rotate(15deg); opacity: 1; }
      100% { transform: rotate(0deg); opacity: 0.4; }
    }

    /* Animation 5: Stagger fade */
    .anim-stagger .part-1 {
      animation: staggerFade 2s ease-in-out infinite;
    }
    .anim-stagger .part-2 {
      animation: staggerFade 2s ease-in-out infinite 0.3s;
    }
    .anim-stagger .part-3 {
      animation: staggerFade 2s ease-in-out infinite 0.6s;
    }
    @keyframes staggerFade {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* Animation 6: Bounce */
    .anim-bounce svg {
      animation: bounce 1.5s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      30% { transform: translateY(-8px); }
      60% { transform: translateY(4px); }
    }

    /* Animation 7: Shimmer */
    .anim-shimmer svg {
      animation: shimmer 2.5s ease-in-out infinite;
    }
    @keyframes shimmer {
      0% { filter: brightness(0.6); }
      50% { filter: brightness(1.4); }
      100% { filter: brightness(0.6); }
    }

    /* Animation 8: Swing */
    .anim-swing svg {
      animation: swing 2s ease-in-out infinite;
      transform-origin: top center;
    }
    @keyframes swing {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(8deg); }
      75% { transform: rotate(-8deg); }
    }

    /* Animation 9: Outline Glare */
    .anim-glare svg path {
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      stroke: #4fc3f7;
      stroke-width: 1.5;
      fill-opacity: 0.6;
      animation: glareTrace 2.5s ease-in-out infinite;
    }
    .anim-glare svg path:nth-child(2) {
      animation-delay: 0.4s;
    }
    .anim-glare svg path:nth-child(3) {
      animation-delay: 0.8s;
    }
    @keyframes glareTrace {
      0% { stroke-dashoffset: 200; fill-opacity: 0.4; }
      50% { stroke-dashoffset: 0; fill-opacity: 1; }
      100% { stroke-dashoffset: -200; fill-opacity: 0.4; }
    }

    /* Animation 10: Glow Pulse */
    .anim-glow svg {
      filter: drop-shadow(0 0 4px rgba(79, 195, 247, 0.3));
      animation: glowPulse 2s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(79, 195, 247, 0.2)); }
      50% { filter: drop-shadow(0 0 16px rgba(79, 195, 247, 0.8)) drop-shadow(0 0 32px rgba(79, 195, 247, 0.4)); }
    }

    /* Animation 11: Outline Chase */
    .anim-chase svg path {
      fill-opacity: 0.5;
      stroke: #4fc3f7;
      stroke-width: 1;
      stroke-dasharray: 60 140;
      animation: chaseOutline 3s linear infinite;
    }
    .anim-chase svg path:nth-child(2) {
      animation-delay: -1s;
      stroke: #81d4fa;
    }
    .anim-chase svg path:nth-child(3) {
      animation-delay: -2s;
      stroke: #b3e5fc;
    }
    @keyframes chaseOutline {
      to { stroke-dashoffset: -200; }
    }

    /* Animation 12: Build Out (paths draw in sequentially) */
    .anim-buildout svg path {
      fill: none;
      stroke: #1A6FA3;
      stroke-width: 2;
      stroke-dasharray: 300;
      stroke-dashoffset: 300;
      animation: buildOut 3s ease forwards infinite;
    }
    .anim-buildout svg path:nth-child(1) {
      animation-delay: 0s;
      stroke: #4fc3f7;
    }
    .anim-buildout svg path:nth-child(2) {
      animation-delay: 0.6s;
      stroke: #0F3D5C;
    }
    .anim-buildout svg path:nth-child(3) {
      animation-delay: 1.2s;
      stroke: #1A6FA3;
    }
    @keyframes buildOut {
      0% { stroke-dashoffset: 300; fill-opacity: 0; }
      60% { stroke-dashoffset: 0; fill-opacity: 0; }
      80% { fill-opacity: 0.8; fill: currentColor; }
      100% { stroke-dashoffset: 0; fill-opacity: 1; fill: currentColor; }
    }

    /* Animation 13: Outline Only - Pulse */
    .anim-outline-pulse svg path {
      fill: none;
      stroke: #4fc3f7;
      stroke-width: 1.5;
      animation: outlinePulse 2s ease-in-out infinite;
    }
    .anim-outline-pulse svg path:nth-child(2) {
      stroke: #81d4fa;
      animation-delay: 0.3s;
    }
    .anim-outline-pulse svg path:nth-child(3) {
      stroke: #b3e5fc;
      animation-delay: 0.6s;
    }
    @keyframes outlinePulse {
      0%, 100% { stroke-width: 1; opacity: 0.5; }
      50% { stroke-width: 2.5; opacity: 1; }
    }

    /* Animation 14: Outline Only - Spin */
    .anim-outline-spin svg {
      animation: spin 2.5s linear infinite;
    }
    .anim-outline-spin svg path {
      fill: none;
      stroke: #4fc3f7;
      stroke-width: 1.5;
    }
    .anim-outline-spin svg path:nth-child(2) {
      stroke: #0e7490;
    }
    .anim-outline-spin svg path:nth-child(3) {
      stroke: #67e8f9;
    }

    /* Animation 15: Outline Only - Draw Loop */
    .anim-outline-draw svg path {
      fill: none;
      stroke: #4fc3f7;
      stroke-width: 1.5;
      stroke-dasharray: 150;
      animation: drawLoop 2.5s ease-in-out infinite alternate;
    }
    .anim-outline-draw svg path:nth-child(2) {
      stroke: #0e7490;
      animation-delay: 0.3s;
    }
    .anim-outline-draw svg path:nth-child(3) {
      stroke: #67e8f9;
      animation-delay: 0.6s;
    }
    @keyframes drawLoop {
      0% { stroke-dashoffset: 150; }
      100% { stroke-dashoffset: -150; }
    }

    /* Animation 16: Outline Only - Breathe Glow */
    .anim-outline-glow svg path {
      fill: none;
      stroke: #4fc3f7;
      stroke-width: 1.5;
      animation: outlineGlow 3s ease-in-out infinite;
    }
    .anim-outline-glow svg {
      filter: drop-shadow(0 0 3px rgba(79, 195, 247, 0.4));
      animation: outlineGlowShadow 3s ease-in-out infinite;
    }
    @keyframes outlineGlow {
      0%, 100% { stroke-opacity: 0.4; stroke-width: 1; }
      50% { stroke-opacity: 1; stroke-width: 2; }
    }
    @keyframes outlineGlowShadow {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(79, 195, 247, 0.2)); }
      50% { filter: drop-shadow(0 0 12px rgba(79, 195, 247, 0.8)); }
    }
  </style>
</head>
